<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日活動告示板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212; /* 防止載入時出現白閃光 */
    }

    /* 全螢幕裁切容器 */
    .wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 將 iframe 向上平移 32px 遮擋藍色橫幅，並補足底部高度 */
    .wrapper iframe {
      position: absolute;
      top: -20px;
      left: 0;
      width: 100%;
      height: calc(100% + 20px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbx9avEoS7xAf_9RD2YsA1HhHoEdZSCLWgj2TcTc1cOxy4h6MtVe_nAqJcHzZRddwOE/exec" allowfullscreen></iframe>
  </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日活動告示板</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
    }

    /* 裁切容器：鎖定畫面大小並隱藏超出部分 */
    .iframe-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 將 iframe 向上平移 37px，把頂部藍色提示條推到畫面外 */
    .iframe-container iframe {
      position: absolute;
      top: -37px; /* 向上偏移藍色 Banner 的高度 */
      left: 0;
      width: 100%;
      height: calc(100% + 37px); /* 補足被推掉的高度 */
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- 請將下面的 src 換成你的 GAS Web App 網址 -->
    <iframe src="https://script.google.com/macros/s/你的網址/exec" allowfullscreen></iframe>
  </div>

</body>
</html>
